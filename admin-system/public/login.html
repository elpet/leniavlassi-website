<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Σύνδεση | Διαχειριστικό</title>
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="center-screen">
  <div class="card login-card">
    <h1>Διαχειριστικό Ιατρείου</h1>
    <p class="login-sub">Λένια Βλάσση — Ψυχολόγος, Γνωσιακή Συμπεριφορική Θεραπεύτρια</p>
    <form id="loginForm">
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="form-row">
        <label for="password">Κωδικός</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p class="error-text" id="loginError" role="alert"></p>
      <button type="submit" class="btn btn-block">Σύνδεση</button>
    </form>
  </div>
</div>
<script src="/js/login.js"></script>
</body>
</html>

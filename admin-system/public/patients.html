<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ασθενείς | Διαχειριστικό</title>
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <span class="brand">Διαχειριστικό Ιατρείου</span>
    <nav>
      <a href="/dashboard.html">Αρχική</a>
      <a href="/appointments.html">Ραντεβού</a>
      <a href="/patients.html" class="active">Ασθενείς</a>
      <a href="/audit.html">Ιστορικό</a>
      <span class="user-email" id="userEmail"></span>
      <button class="btn btn-secondary btn-small" data-logout>Αποσύνδεση</button>
    </nav>
  </div>

  <div class="page">
    <div class="page-header">
      <h2>Ασθενείς</h2>
      <button class="btn" id="newPatientBtn">+ Νέος Ασθενής</button>
    </div>
    <div id="patientsList"></div>
  </div>
</div>

<div class="modal-backdrop" id="patientModal" hidden>
  <div class="modal">
    <h3 id="modalTitle">Νέος Ασθενής</h3>
    <form id="patientForm">
      <input type="hidden" id="patientId">
      <div class="form-row">
        <label for="fullName">Ονοματεπώνυμο *</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="form-row">
        <label for="phone">Τηλέφωνο</label>
        <input type="tel" id="phone">
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
      <div class="form-row">
        <label for="notes">Κλινικές Σημειώσεις</label>
        <textarea id="notes" rows="4"></textarea>
        <span class="note-text">Αποθηκεύεται κρυπτογραφημένο (AES-256).</span>
      </div>
      <div class="checkbox-row" id="consentRow">
        <input type="checkbox" id="consentGiven">
        <label for="consentGiven">Ο/Η ασθενής έχει ενημερωθεί και συναινεί στην τήρηση των στοιχείων του/της σύμφωνα με τον ΓΚΠΔ.</label>
      </div>
      <p class="error-text" id="formError" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelModalBtn">Άκυρο</button>
        <button type="submit" class="btn">Αποθήκευση</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/patients.js"></script>
</body>
</html>

# Ρυθμίσεις του admin panel (Sveltia CMS) — https://github.com/sveltia/sveltia-cms
# Κάθε "Αποθήκευση/Δημοσίευση" κάνει commit στο GitHub και το site ενημερώνεται σε ~2 λεπτά.

backend:
  name: github
  repo: elpet/leniavlassi-website
  branch: main
  commit_messages:
    create: "Admin: νέο «{{slug}}» ({{collection}})"
    update: "Admin: ενημέρωση «{{slug}}» ({{collection}})"
    delete: "Admin: διαγραφή «{{slug}}» ({{collection}})"
    uploadMedia: "Ανέβασμα εικόνας {{path}}"
    deleteMedia: "Διαγραφή εικόνας {{path}}"

media_folder: src/images/blog
public_folder: /images/blog

slug:
  encoding: unicode
  clean_accents: true

collections:
  - name: blog
    label: Άρθρα Blog
    label_singular: Άρθρο
    description: >-
      Γράψτε το άρθρο και πατήστε Save. Με «Πρόχειρο» ενεργό δεν δημοσιεύεται.
      Με ημερομηνία στο μέλλον δημοσιεύεται αυτόματα εκείνη τη μέρα.
      Κώδικας Δεοντολογίας Ψυχολόγων: τα άρθρα να είναι ενημερωτικά και όχι διαφημιστικά (άρθρο 10),
      χωρίς ψυχολογικά τεστ/ερωτηματολόγια (άρθρο 5), χωρίς ιατρικές συμβουλές (άρθρο 4) και
      χωρίς στοιχεία που θα μπορούσαν να αναγνωρίσουν θεραπευόμενο.
    folder: src/blog/posts
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    summary: "{{title}} — {{date}}{{draft | ternary(' (πρόχειρο)', '')}}"
    sortable_fields: [date, title, category]
    view_filters:
      - label: Πρόχειρα
        field: draft
        pattern: true
    fields:
      - { name: title, label: Τίτλος, widget: string }
      - name: description
        label: Σύντομη περιγραφή
        hint: 1-2 προτάσεις. Εμφανίζεται στη λίστα του blog και στην προεπισκόπηση του Facebook.
        widget: text
      - name: date
        label: Ημερομηνία δημοσίευσης
        hint: Αν βάλετε μελλοντική ημερομηνία, το άρθρο δημοσιεύεται αυτόματα τότε.
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
      - name: category
        label: Κατηγορία
        widget: select
        required: false
        options: [Άγχος, Σχέσεις, Αυτοεκτίμηση, Κατάθλιψη, Mindfulness, Τραύμα, Καθημερινότητα, Γονεϊκότητα]
      - name: image
        label: Κεντρική εικόνα
        hint: Ιδανικά οριζόντια, περίπου 1200×630. Αυτή φαίνεται στο Facebook.
        widget: image
        required: false
      - { name: imageAlt, label: Περιγραφή εικόνας (για προσβασιμότητα), widget: string, required: false }
      - { name: body, label: Κείμενο, widget: markdown }
      - name: updated
        label: Τελευταία ουσιαστική ενημέρωση (προαιρετικό)
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
        required: false
      - name: draft
        label: Πρόχειρο (να μη δημοσιευτεί ακόμα)
        widget: boolean
        default: false
        required: false
      - name: facebook
        label: Αυτόματη ανάρτηση στη σελίδα Facebook
        widget: boolean
        default: true
        required: false
      - name: facebookMessage
        label: Κείμενο ανάρτησης Facebook (προαιρετικό)
        hint: Αν μείνει κενό, χρησιμοποιείται η σύντομη περιγραφή. Ενημερωτικό ύφος — όχι προτροπές για ραντεβού ή προσφορές (άρθρο 10 Κώδικα Δεοντολογίας).
        widget: text
        required: false
      - name: slug
        label: Διεύθυνση URL (προαιρετικό)
        hint: Αφήστε κενό — δημιουργείται αυτόματα από τον τίτλο με λατινικούς χαρακτήρες. Μην το αλλάζετε αφού δημοσιευτεί.
        widget: string
        required: false

  - name: pages
    label: Περιεχόμενο σελίδων
    files:
      - name: about
        label: Βιογραφικό
        file: src/_data/about.json
        format: json
        fields:
          - { name: subtitle, label: Υπότιτλος, widget: string }
          - name: bio
            label: Κείμενο βιογραφικού (μία παράγραφος ανά στοιχείο)
            widget: list
            field: { name: paragraph, label: Παράγραφος, widget: text }
          - name: credentials
            label: Σπουδές & εκπαίδευση
            hint: Μόνο τίτλοι που έχουν αποκτηθεί νόμιμα. Ό,τι δεν έχει ολοκληρωθεί σημειώνεται «σε εξέλιξη» (άρθρο 10 Κώδικα Δεοντολογίας).
            widget: list
            summary: "{{text}}"
            fields:
              - { name: text, label: Τίτλος / εκπαίδευση, widget: text }
              - { name: inProgress, label: Σε εξέλιξη, widget: boolean, default: false, required: false }
          - name: highlights
            label: Τρία βασικά στοιχεία (αρχική σελίδα)
            widget: list
            max: 4
            summary: "{{label}} — {{detail}}"
            fields:
              - { name: label, label: Σύντομο (π.χ. ΕΚΠΑ), widget: string }
              - { name: detail, label: Περιγραφή, widget: string }
          - name: alumniOf
            label: Πανεπιστήμια αποφοίτησης (για το Google)
            widget: list
            field: { name: name, label: Πανεπιστήμιο, widget: string }
      - name: areas
        label: Τομείς που καλύπτω
        file: src/_data/areas.json
        format: json
        fields:
          - { name: intro, label: Εισαγωγικό κείμενο (σελίδα Υπηρεσιών), widget: text }
          - name: list
            label: Τομείς
            hint: Εμφανίζονται στην αρχική και στις Υπηρεσίες, και δηλώνονται στο Google ως αντικείμενο εξειδίκευσης.
            widget: list
            field: { name: area, label: Τομέας, widget: string }
      - name: faq
        label: Συχνές ερωτήσεις
        file: src/_data/faq.json
        format: json
        fields:
          - name: list
            label: Ερωτήσεις
            label_singular: Ερώτηση
            widget: list
            summary: "{{question}}"
            fields:
              - { name: question, label: Ερώτηση, widget: string }
              - { name: answer, label: Απάντηση, widget: markdown, buttons: [bold, italic, link], editor_components: [], modes: [rich_text] }
      - name: services
        label: Υπηρεσίες
        file: src/_data/services.json
        format: json
        fields:
          - name: list
            label: Υπηρεσίες
            label_singular: Υπηρεσία
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: Τίτλος, widget: string }
              - { name: quote, label: Απόφθεγμα (προαιρετικό), widget: text, required: false }
              - { name: author, label: Συγγραφέας αποφθέγματος, widget: string, required: false }
              - { name: description, label: Περιγραφή, widget: text, required: false }
              - { name: home, label: Εμφάνιση στην αρχική σελίδα, widget: boolean, default: false, required: false }

  - name: settings
    label: Ρυθμίσεις
    files:
      - name: contact
        label: Στοιχεία επικοινωνίας & φόρμα
        file: src/_data/settings.json
        format: json
        fields:
          - { name: phone, label: Τηλέφωνο, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: address, label: Διεύθυνση, widget: string }
          - { name: hours, label: Ωράριο, widget: string }
          - { name: facebookUrl, label: Σελίδα Facebook (URL), widget: string, required: false }
          - { name: instagramUrl, label: Instagram (URL), widget: string, required: false }
          - { name: linkedinUrl, label: LinkedIn (URL), widget: string, required: false }
          - name: web3formsKey
            label: Κλειδί φόρμας (Web3Forms access key)
            hint: Χρειάζεται μόνο αν ΔΕΝ έχει ρυθμιστεί το Google Apps Script των κρατήσεων (τότε η φόρμα στέλνει μέσω αυτού). Αν μείνουν κενά και τα δύο, η φόρμα ανοίγει το email του επισκέπτη.
            widget: string
            required: false
          - name: legal
            label: Στοιχεία επαγγελματία (νομικές πληροφορίες)
            widget: object
            collapsed: false
            fields:
              - { name: fullName, label: Ονοματεπώνυμο, widget: string }
              - { name: title, label: Επαγγελματικός τίτλος, widget: string, hint: Μόνο τίτλοι που έχουν αποκτηθεί νόμιμα (άρθρο 10 Κώδικα Δεοντολογίας). }
              - { name: licenseNumber, label: Αριθμός άδειας άσκησης επαγγέλματος, widget: string, required: false, hint: Συνιστάται — εμφανίζεται στα Στοιχεία επαγγελματία και στο υποσέλιδο. }
              - { name: licenseAuthority, label: Αρχή έκδοσης άδειας (π.χ. Περιφέρεια Αττικής), widget: string, required: false }
              - { name: afm, label: ΑΦΜ (προαιρετικό), widget: string, required: false }
              - { name: doy, label: ΔΟΥ (προαιρετικό), widget: string, required: false }
              - { name: association, label: Επαγγελματικός σύλλογος (αν είστε μέλος), widget: string, required: false }
              - { name: conflictOfInterest, label: Δήλωση σύγκρουσης συμφερόντων (άρθρο 11), widget: text }
              - { name: insuranceContracts, label: Συμβάσεις με Δημόσιο/ΕΟΠΥΥ/ασφαλιστικά ταμεία (προαιρετικό), widget: text, required: false }
          - name: seo
            label: Google & μηχανές αναζήτησης
            widget: object
            collapsed: true
            fields:
              - { name: googleSiteVerification, label: Κωδικός επαλήθευσης Google Search Console, widget: string, required: false, hint: "Από το Search Console → Μέθοδος «Ετικέτα HTML»: μόνο η τιμή content=\"…\"." }
              - { name: bingSiteVerification, label: Κωδικός επαλήθευσης Bing Webmaster Tools, widget: string, required: false }
              - { name: googleBusinessUrl, label: Link καταχώρισης Google Business (Google Maps), widget: string, required: false, hint: "Google Maps → η καταχώρισή σας → Κοινοποίηση → Αντιγραφή συνδέσμου. Χρησιμοποιείται στο «Οδηγίες στον χάρτη» και συνδέει την καταχώριση με το site για το Google." }
              - name: geo
                label: Συντεταγμένες γραφείου (από το Google Maps)
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: latitude, label: Γεωγραφικό πλάτος, widget: number, value_type: float, required: false }
                  - { name: longitude, label: Γεωγραφικό μήκος, widget: number, value_type: float, required: false }
              - name: sameAs
                label: Επαγγελματικά προφίλ (Google Business, doctoranytime κ.λπ.)
                hint: Βοηθούν το Google να συνδέσει τα προφίλ σας με την ιστοσελίδα.
                widget: list
                field: { name: url, label: URL, widget: string }
          - name: practice
            label: Πρακτικές πληροφορίες συνεδριών
            widget: object
            collapsed: false
            fields:
              - { name: onlineSessions, label: Παρέχονται online συνεδρίες, widget: boolean, default: true }
              - { name: onlinePlatform, label: Πλατφόρμα online συνεδριών (προαιρετικό), widget: string, required: false }
              - { name: sessionDuration, label: Διάρκεια συνεδρίας, widget: string }
              - name: fees
                label: Αμοιβές (προαιρετικό — αν μείνει κενό, «θα ενημερωθείτε τηλεφωνικά»)
                widget: list
                required: false
                summary: "{{service}}: {{price}}"
                fields:
                  - { name: service, label: Υπηρεσία, widget: string }
                  - { name: price, label: Αμοιβή (π.χ. 60 €), widget: string }
              - { name: paymentMethods, label: Τρόποι πληρωμής (π.χ. μετρητά, κάρτα, IRIS), widget: string, required: false }
              - { name: cancellationPolicy, label: Πολιτική ακυρώσεων, widget: text }

      - name: booking
        label: Κρατήσεις ραντεβού
        file: src/_data/booking.json
        format: json
        fields:
          - name: services
            label: Υπηρεσίες
            widget: list
            summary: "{{name}} ({{duration}}′)"
            fields:
              - { name: id, label: Κωδικός (λατινικά, χωρίς κενά — μην τον αλλάζετε μετά), widget: string, pattern: ['^[a-z0-9-]+$', 'Μόνο μικρά λατινικά, αριθμοί και παύλες'] }
              - { name: name, label: Όνομα, widget: string }
              - { name: duration, label: Διάρκεια (λεπτά), widget: number, value_type: int, min: 15, max: 240 }
              - { name: description, label: Περιγραφή, widget: text, required: false }
              - name: modes
                label: Τρόπος
                widget: select
                multiple: true
                options:
                  - { label: Δια ζώσης, value: inperson }
                  - { label: Online, value: online }
          - name: weeklyHours
            label: Εβδομαδιαίο ωράριο ραντεβού
            hint: Διαστήματα της μορφής 10:00-14:00. Κενή μέρα = κλειστά.
            widget: object
            fields:
              - { name: mon, label: Δευτέρα, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: tue, label: Τρίτη, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: wed, label: Τετάρτη, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: thu, label: Πέμπτη, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: fri, label: Παρασκευή, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: sat, label: Σάββατο, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: sun, label: Κυριακή, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
          - name: blockedDates
            label: Κλειστές ημέρες (αργίες, άδειες)
            hint: Εναλλακτικά, ένα ολοήμερο γεγονός στο Google Calendar κλείνει επίσης τη μέρα.
            widget: list
            required: false
            field: { name: date, label: Ημερομηνία, widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false }
          - { name: slotInterval, label: Νέο ραντεβού κάθε (λεπτά), widget: number, value_type: int }
          - { name: bufferMinutes, label: Κενό ανάμεσα σε ραντεβού (λεπτά), widget: number, value_type: int }
          - { name: minNoticeHours, label: Ελάχιστη προειδοποίηση (ώρες), widget: number, value_type: int }
          - { name: maxDaysAhead, label: Κρατήσεις έως πόσες μέρες μπροστά, widget: number, value_type: int }
          - { name: cancelNoticeHours, label: Online ακύρωση έως (ώρες πριν), widget: number, value_type: int }
          - name: appsScriptUrl
            label: Διεύθυνση Google Apps Script (Web app URL)
            hint: Από την εγκατάσταση του booking-backend. Κενό = εμφανίζεται το Google ημερολόγιο ή η φόρμα επικοινωνίας.
            widget: string
            required: false
          - name: googleBookingUrl
            label: Εναλλακτικά — σύνδεσμος Google Appointment Schedule (embed)
            hint: Χρησιμοποιείται μόνο αν η παραπάνω διεύθυνση είναι κενή.
            widget: string
            required: false
          - { name: timezone, label: Ζώνη ώρας, widget: hidden, default: Europe/Athens }

# Ρυθμίσεις του admin panel (Sveltia CMS) — https://github.com/sveltia/sveltia-cms
# Κάθε "Αποθήκευση/Δημοσίευση" κάνει commit στο GitHub και το site ενημερώνεται σε ~2 λεπτά.

backend:
  name: github
  repo: elpet/leniavlassi-website
  branch: main
  commit_messages:
    create: "Blog: νέο άρθρο «{{slug}}»"
    update: "Blog: ενημέρωση «{{slug}}»"
    delete: "Blog: διαγραφή «{{slug}}»"
    uploadMedia: "Ανέβασμα εικόνας {{path}}"
    deleteMedia: "Διαγραφή εικόνας {{path}}"

media_folder: src/images/blog
public_folder: /images/blog

slug:
  encoding: unicode
  clean_accents: true

collections:
  - name: blog
    label: Άρθρα Blog
    label_singular: Άρθρο
    description: >-
      Γράψτε το άρθρο και πατήστε Save. Με «Πρόχειρο» ενεργό δεν δημοσιεύεται.
      Με ημερομηνία στο μέλλον δημοσιεύεται αυτόματα εκείνη τη μέρα.
    folder: src/blog/posts
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    summary: "{{title}} — {{date}}{{draft | ternary(' (πρόχειρο)', '')}}"
    sortable_fields: [date, title, category]
    view_filters:
      - label: Πρόχειρα
        field: draft
        pattern: true
    fields:
      - { name: title, label: Τίτλος, widget: string }
      - name: description
        label: Σύντομη περιγραφή
        hint: 1-2 προτάσεις. Εμφανίζεται στη λίστα του blog και στην προεπισκόπηση του Facebook.
        widget: text
      - name: date
        label: Ημερομηνία δημοσίευσης
        hint: Αν βάλετε μελλοντική ημερομηνία, το άρθρο δημοσιεύεται αυτόματα τότε.
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
      - name: category
        label: Κατηγορία
        widget: select
        required: false
        options: [Άγχος, Σχέσεις, Αυτοεκτίμηση, Κατάθλιψη, Mindfulness, Τραύμα, Καθημερινότητα, Γονεϊκότητα]
      - name: image
        label: Κεντρική εικόνα
        hint: Ιδανικά οριζόντια, περίπου 1200×630. Αυτή φαίνεται στο Facebook.
        widget: image
        required: false
      - { name: imageAlt, label: Περιγραφή εικόνας (για προσβασιμότητα), widget: string, required: false }
      - { name: body, label: Κείμενο, widget: markdown }
      - name: draft
        label: Πρόχειρο (να μη δημοσιευτεί ακόμα)
        widget: boolean
        default: false
        required: false
      - name: facebook
        label: Αυτόματη ανάρτηση στη σελίδα Facebook
        widget: boolean
        default: true
        required: false
      - name: facebookMessage
        label: Κείμενο ανάρτησης Facebook (προαιρετικό)
        hint: Αν μείνει κενό, χρησιμοποιείται η σύντομη περιγραφή.
        widget: text
        required: false
      - name: slug
        label: Διεύθυνση URL (προαιρετικό)
        hint: Αφήστε κενό — δημιουργείται αυτόματα από τον τίτλο με λατινικούς χαρακτήρες. Μην το αλλάζετε αφού δημοσιευτεί.
        widget: string
        required: false

  - name: settings
    label: Ρυθμίσεις
    files:
      - name: contact
        label: Στοιχεία επικοινωνίας & φόρμα
        file: src/_data/settings.json
        format: json
        fields:
          - { name: phone, label: Τηλέφωνο, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: address, label: Διεύθυνση, widget: string }
          - { name: hours, label: Ωράριο, widget: string }
          - { name: facebookUrl, label: Σελίδα Facebook (URL), widget: string, required: false }
          - { name: instagramUrl, label: Instagram (URL), widget: string, required: false }
          - name: web3formsKey
            label: Κλειδί φόρμας (Web3Forms access key)
            hint: Από το web3forms.com. Αν μείνει κενό, η φόρμα ανοίγει το email του επισκέπτη.
            widget: string
            required: false

      - name: booking
        label: Κρατήσεις ραντεβού
        file: src/_data/booking.json
        format: json
        fields:
          - name: services
            label: Υπηρεσίες
            widget: list
            summary: "{{name}} ({{duration}}′)"
            fields:
              - { name: id, label: Κωδικός (λατινικά, χωρίς κενά — μην τον αλλάζετε μετά), widget: string, pattern: ['^[a-z0-9-]+$', 'Μόνο μικρά λατινικά, αριθμοί και παύλες'] }
              - { name: name, label: Όνομα, widget: string }
              - { name: duration, label: Διάρκεια (λεπτά), widget: number, value_type: int, min: 15, max: 240 }
              - { name: description, label: Περιγραφή, widget: text, required: false }
              - name: modes
                label: Τρόπος
                widget: select
                multiple: true
                options:
                  - { label: Δια ζώσης, value: inperson }
                  - { label: Online, value: online }
          - name: weeklyHours
            label: Εβδομαδιαίο ωράριο ραντεβού
            hint: Διαστήματα της μορφής 10:00-14:00. Κενή μέρα = κλειστά.
            widget: object
            fields:
              - { name: mon, label: Δευτέρα, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: tue, label: Τρίτη, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: wed, label: Τετάρτη, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: thu, label: Πέμπτη, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: fri, label: Παρασκευή, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: sat, label: Σάββατο, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
              - { name: sun, label: Κυριακή, widget: list, field: { name: range, label: Διάστημα, widget: string }, required: false }
          - name: blockedDates
            label: Κλειστές ημέρες (αργίες, άδειες)
            hint: Εναλλακτικά, ένα ολοήμερο γεγονός στο Google Calendar κλείνει επίσης τη μέρα.
            widget: list
            required: false
            field: { name: date, label: Ημερομηνία, widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false }
          - { name: slotInterval, label: Νέο ραντεβού κάθε (λεπτά), widget: number, value_type: int }
          - { name: bufferMinutes, label: Κενό ανάμεσα σε ραντεβού (λεπτά), widget: number, value_type: int }
          - { name: minNoticeHours, label: Ελάχιστη προειδοποίηση (ώρες), widget: number, value_type: int }
          - { name: maxDaysAhead, label: Κρατήσεις έως πόσες μέρες μπροστά, widget: number, value_type: int }
          - { name: cancelNoticeHours, label: Online ακύρωση έως (ώρες πριν), widget: number, value_type: int }
          - name: appsScriptUrl
            label: Διεύθυνση Google Apps Script (Web app URL)
            hint: Από την εγκατάσταση του booking-backend. Κενό = εμφανίζεται το Google ημερολόγιο ή η φόρμα επικοινωνίας.
            widget: string
            required: false
          - name: googleBookingUrl
            label: Εναλλακτικά — σύνδεσμος Google Appointment Schedule (embed)
            hint: Χρησιμοποιείται μόνο αν η παραπάνω διεύθυνση είναι κενή.
            widget: string
            required: false
          - { name: timezone, label: Ζώνη ώρας, widget: hidden, default: Europe/Athens }
